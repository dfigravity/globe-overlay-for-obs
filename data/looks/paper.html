ewel",note:`jewel (ruby, sapphire, emerald, gold) \xB7 pastel \xB7 amber (cathedral golds) \xB7 mono (smoky clear glass). Multi-colour mode: pick "Use Continent colours" to use the Land group's colours (panes tinted toward the Continent colour, Coastline colour = the lead)`},{key:"glass.cells",live:!0,label:"Pane count",type:"range",min:40,max:400,step:10,def:200,note:"how many panes make up the land. More = smaller panes"},{key:"glass.leadWidth",live:!0,label:"Lead width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of the black lead lines and the coastline"},{key:"glass.mottle",live:!0,label:"Glass texture",type:"range",min:0,max:3,step:.05,def:1,note:"mottle, streaks and bubbles in the glass. 0 = smooth"},{key:"glass.glint",live:!0,label:"Glint speed",type:"range",min:0,max:4,step:.05,def:1,note:"how fast the light sweeps across the panes. 0 = still"},{key:"glass.oceanLead",live:!0,label:"Sea lead lines",type:"range",min:0,max:3,step:.05,def:1,note:"the faint lead net over the sea (ocean style auto). 0 = none"},{key:"glass.frame",live:!0,label:"Window frame",type:"toggle",def:!0,note:"a lead ring round the globe"}]},{group:"Vector scope",looks:["scope"],items:[{key:"scope.phosphor",live:!0,label:"Phosphor",type:"select",options:["green","p1","blue","amber","white","red","cyan","magenta","violet","land"],labels:["P31 green","P1 radar green","P7 blue-white","P3 amber","P4 white","Red","Cyan","Magenta","Violet","Use Continent colours"],def:"green",note:`the screen's phosphor colour. Pick "Use Continent colours" to use the Land group's colours (beam = Continent, grid and rim = Coastline)`},{key:"scope.persistence",live:!0,label:"Persistence",type:"range",min:0,max:1,step:.05,def:.5,note:"how long beams afterglow: swoops, writing, the retrace tail. 0 = snappy, 1 = long glow"},{key:"scope.beam",live:!0,label:"Beam width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of every beam line"},{key:"scope.glow",live:!0,label:"Glow",type:"range",min:0,max:4,step:.05,def:1,note:"phosphor bloom around the lines. 0 = none"},{key:"scope.retrace",live:!0,label:"Retrace speed",type:"range",min:0,max:4,step:.05,def:1,note:"beams re-drawing the coastline. 0 = steady, no retrace"},{key:"scope.jitter",live:!0,label:"Beam jitter",type:"range",min:0,max:4,step:.05,def:1,note:"analog shimmer on the coastline. 0 = rock steady"},{key:"scope.graticule",live:!0,label:"Grid lines",type:"toggle",def:!0,note:"the dim latitude/longitude grid"}]},{group:"Paper",looks:["paper"],items:[{key:"paper.layers",live:!0,label:"Paper layers",type:"range",min:2,max:7,step:1,def:5,note:"how many cut-paper sheets the continents are stacked from"},{key:"paper.palette",live:!0,label:"Paper colours",type:"select",options:["pastel","kraft","atlas","mono","neon","land"],labels:["Pastel","Kraft","Atlas","Mono","Neon","Use Continent colours"],def:"pastel",note:`pastel (soft rainbow) \xB7 kraft (brown card) \xB7 atlas (relief-map greens) \xB7 mono (white card) \xB7 neon (bright card). Pick "Use Continent colours" to use the Land group's colours (sheets from the Continent colour, cut edges from the Coastline colour)`},{key:"paper.spacing",live:!0,label:"Layer spacing",type:"range",min:0,max:3,step:.05,def:1,note:"gap between the sheets: more = deeper stack, longer shadows, more parallax. 0 = flat"},{key:"paper.shadow",live:!0,label:"Shadow strength",type:"range",min:0,max:2,step:.05,def:1,note:"drop shadow under each sheet and onto your video. 0 = none"},{key:"paper.softness",live:!0,label:"Shadow softness",type:"range",min:.2,max:3,step:.05,def:1,note:"1.0 = soft, 0.3 = crisp, 3.0 = very blurry"},{key:"paper.tissue",live:!0,label:"Tissue-paper sea",type:"toggle",def:!0,note:"translucent blue tissue strips along the coasts (ocean style auto). Off = the swell pattern instead"},{key:"paper.flag",live:!0,label:"Name style",type:"select",options:["plain","banner"],labels:["Plain names","Paper ribbon banners"],def:"plain",note:"plain (outlined names, no background) \xB7 banner (names on a paper ribbon)"}]},{group:"1-Bit",looks:["dither"],items:[{key:"dither.pixel",live:!0,label:"Pixel size",type:"range",min:1,max:4,step:1,def:2,note:"screen pixels per dither pixel. 2 = crisp, 3\u20134 = chunky retro"},{key:"dither.inks",live:!0,label:"Ink pair",type:"select",options:["bone","paper","phosphor","amber","gameboy","blueprint","riso","ice","land"],labels:["Bone","Paper","Phosphor","Amber","Game Boy","Blueprint","Riso","Ice","Use Continent colours"],def:"bone",note:`the two inks (light / dark). Pick "Use Continent colours" to use the Land group's colours (Continent colour = light ink, Coastline colour = dark ink)`},{key:"dither.pattern",live:!0,label:"Dither",type:"select",options:["bayer4","bayer8","halftone","riso"],def:"bayer8",note:"bayer4 (coarse grid) \xB7 bayer8 (fine grid) \xB7 halftone (45\xB0 dot screen) \xB7 riso (halftone with the dark ink printed off-register)"},{key:"dither.contrast",live:!0,label:"Contrast",type:"range",min:.3,max:3,step:.05,def:1,note:"how hard the light falls off into the shadow side"},{key:"dither.hatch",live:!0,label:"Engraved hatching",type:"toggle",def:!0,note:"latitude lines that thicken into the shadow. Off = plain dither"},{key:"dither.graticule",live:!0,label:"Graticule",type:"toggle",def:!0,note:"dotted 30\xB0 latitude/longitude lines over the sea"},{key:"dither.dial",live:!0,label:"Pocket-watch dial",type:"toggle",def:!0,note:"the ticking watch dial around your pin (uses the ring colour/size/speed)"}]},{group:"Synthwave",looks:["synth"],items:[{key:"synth.palette",live:!0,label:"Palette",type:"select",options:["outrun","vaporwave","tron","acid","land"],labels:["Outrun","Vaporwave","Tron","Acid","Use Continent colours"],def:"outrun",note:`outrun (magenta grid, cyan coast, orange\u2192pink sun) \xB7 vaporwave (pastels) \xB7 tron (blue / white) \xB7 acid (green / yellow). Pick "Use Continent colours" to use the Land group's colours (Continent colour = grid, Coastline colour = coast)`},{key:"synth.sunMode",live:!0,label:"Retro sun",type:"select",options:["ocean","behind","off"],labels:["In the sea","Behind the planet","Off"],def:"ocean",note:"in the sea (the striped sun shows through the ocean, masked by the land) \xB7 behind (a big sun sinking behind the planet) \xB7 off"},{key:"synth.sunSize",live:!0,label:"Sun size",type:"range",min:.4,max:2.5,step:.05,def:1,note:"size of the retro sun (in the sea or behind the planet)"},{key:"synth.grid",live:!0,label:"Grid density",type:"range",min:.4,max:3,step:.05,def:1,note:"how many grid lines cover the land. 1 = every 3\xB0"},{key:"synth.terrain",live:!0,label:"Terrain height",type:"range",min:0,max:3,step:.05,def:1,note:"how tall the wireframe mountains rise. 0 = flat"},{key:"synth.vhs",live:!0,label:"VHS amount",type:"range",min:0,max:2,step:.05,def:1,note:"scanlines, colour fringing, tracking glitch and grain. 0 = clean"},{key:"synth.glow",live:!0,label:"Neon glow",type:"range",min:0,max:2.5,step:.05,def:1,note:"soft glow round the grid, coast, rim and sun"}]},{group:"Thermal vision",looks:["thermal"],items:[{key:"thermal.palette",live:!0,label:"Palette",type:"select",options:["ironbow","rainbow","whitehot","blackhot","arctic","land"],labels:["Ironbow","Rainbow","White hot","Black hot","Arctic","Use Continent colours"],def:"ironbow",note:`the heat camera's false colours. Pick "Use Continent colours" to use the Land group's colours (a ramp built around the Continent colour, Coastline colour = the outline)`},{key:"thermal.decay",live:!0,label:"Cool-down time",type:"range",min:3,max:120,step:1,def:20,note:"seconds a check-in takes to cool from white-hot to its lasting warm glow"},{key:"thermal.radius",live:!0,label:"Heat spot size",type:"range",min:.3,max:3,step:.05,def:1,note:"how far each viewer's heat spreads"},{key:"thermal.crowd",live:!0,label:"Crowd warmth",type:"range",min:0,max:3,step:.05,def:1,note:"how much each viewer keeps warming their region after the flash. 0 = flashes only"},{key:"thermal.shimmer",live:!0,label:"Heat shimmer",type:"range",min:0,max:3,step:.05,def:1,note:"heat-haze wobble and flicker. 0 = still"},{key:"thermal.grain",live:!0,label:"Sensor grain",type:"range",min:0,max:2,step:.05,def:.6,note:"noise, scanlines and the rolling bar on the globe. 0 = clean"},{key:"thermal.hud",live:!0,label:"Camera HUD",type:"toggle",def:!0,note:"corner brackets, reticles, \xB0C readouts, span bar"}]},{group:"Liquid chrome",looks:["chrome"],items:[{key:"chrome.metal",live:!0,label:"Metal",type:"select",options:["chrome","gold","copper","rose","gunmetal","oil","land"],labels:["Chrome","Gold","Copper","Rose gold","Gunmetal","Oil slick","Use Continent colours"],def:"chrome",note:`chrome \xB7 gold \xB7 copper \xB7 rose gold \xB7 gunmetal \xB7 oil (iridescent oil-slick). Pick "Use Continent colours" to use the Land group's colours (Continent colour = metal tint, Coastline colour = rim light)`},{key:"chrome.ripple",live:!0,label:"Ripple strength",type:"range",min:0,max:3,step:.05,def:1,note:"how hard each check-in ripples the metal. 0 = no ripples"},{key:"chrome.rippleSpeed",live:!0,label:"Ripple speed",type:"range",min:.25,max:3,step:.05,def:1,note:"how fast the ripples run outward and fade"},{key:"chrome.bulge",live:!0,label:"Bulge height",type:"range",min:0,max:3,step:.05,def:1,note:"how far the continents rise out of the sea. 0 = flat mirror"},{key:"chrome.flow",live:!0,label:"Idle flow",type:"range",min:0,max:3,step:.05,def:1,note:"the slow liquid swell across the metal. 0 = still"},{key:"chrome.shine",live:!0,label:"Reflection brightness",type:"range",min:.3,max:2,step:.05,def:1,note:"brightness of the studio reflections"},{key:"chrome.droplet",live:!0,label:"Streamer droplet",type:"toggle",def:!0,note:"the liquid droplet above your location"}]},{group:"Star chart",looks:["stars"],items:[{key:"stars.palette",live:!0,label:"Palette",type:"select",options:["gold","silver","sepia","land"],labels:["Gold on midnight","Silver","Sepia antique","Use Continent colours"],def:"gold",note:`the atlas inks. Pick "Use Continent colours" to use the Land group's colours (Continent colour = star dust, Coastline colour = coast and grid lines)`},{key:"stars.lines",live:!0,label:"Constellation lines",type:"toggle",def:!0,note:"join the viewers' stars into a constellation (shortest-path tree)"},{key:"stars.lineStyle",live:!0,label:"Line style",type:"select",options:["solid","dotted"],labels:["Solid","Dotted"],def:"solid",note:"how the constellation lines are drawn"},{key:"stars.twinkle",live:!0,label:"Twinkle",type:"range",min:0,max:2,step:.05,def:1,note:"how much the stars and star dust shimmer. 0 = steady"},{key:"stars.dust",live:!0,label:"Star dust density",type:"range",min:.25,max:3,step:.05,def:1,note:"how many stars fill the continents"},{key:"stars.graticule",live:!0,label:"Grid and rim",type:"toggle",def:!0,note:"gold latitude/longitude grid, ecliptic, degree labels and the astrolabe rim"},{key:"stars.shade",live:!0,label:"Sphere backdrop",type:"range",min:0,max:1,step:.05,def:.35,note:"a see-through night-sky disc behind the globe, in the palette's colour (midnight navy \xB7 slate \xB7 dark brown \xB7 dark Continent colour), so the globe reads as a disc over dark or bright video. 0 = fully clear, 1 = nearly solid"}]},{group:"Names",items:[{key:"nameSize",live:!0,label:"Viewer name size",type:"range",min:.5,max:3,step:.05,def:1,note:"1.0 = normal, 1.5 = 50% bigger, 0.8 = smaller"},{key:"streamerNameSize",live:!0,label:"Your name size",type:"range",min:.5,max:3,step:.05,def:1,note:"your own name"},{key:"nameDir",live:!0,label:"Name direction",type:"select",options:["out","up"],labels:["Straight out from the globe","Straight up"],def:"out",note:"straight out = each needle points straight out into space from its spot on the globe \xB7 straight up = up the screen"},{key:"nameFont",live:!0,label:"Name font",type:"select",options:["auto","inter","mono","rounded","condensed","marker","serif","pixel","hand","future"],labels:["Look's own (original)","Inter (classic)","Mono","Rounded","Condensed","Marker","Serif","Pixel","Handwritten","Futuristic"],def:"auto",note:"auto = each look's own font (Inter, the original, on most looks) \xB7 or pick one font for every look"},{key:"nameHeight",live:!0,label:"Name height above surface",type:"range",min:0,max:3,step:.05,def:1,note:"how far names float above the ground (the needle length). 1.0 = normal, 2.0 = twice as high, 0 = on the surface"}]},{group:"Crowded names",items:[{key:"labels.cycle",live:!0,label:"Take turns when names crowd",type:"toggle",def:!0,note:"when names pile up in one area, show a few at a time and rotate through the rest. Your name always shows; new check-ins jump the queue"},{key:"labels.max",live:!0,label:"Names shown per crowd",type:"range",min:1,max:8,step:1,def:3,note:"how many names in one crowded area are visible at once (yours counts)"},{key:"labels.dwell",live:!0,label:"Seconds per name",type:"range",min:1,max:15,step:.5,def:4,note:"how long each name stays before the next one takes its place"},{key:"labels.spotlight",live:!0,label:"New check-in spotlight",type:"range",min:0,max:20,step:1,def:8,note:"seconds a new check-in is guaranteed to show. 0 = waits its turn"},{key:"labels.radius",live:!0,label:"Crowd size",type:"range",min:1,max:15,step:.5,def:4,note:"how close (in degrees, ~110 km each) check-ins must be to share turns"}]},{group:"Pins",items:[{key:"pinWidth",live:!0,label:"Needle thickness",type:"range",min:.5,max:8,step:.1,def:1,note:"2.0 = twice as thick"},{key:"pinSize",live:!0,label:"Pin head size",type:"range",min:.5,max:5,step:.05,def:1,note:"the dot on top"},{key:"pinColor",live:!0,label:"Viewer pin colour",type:"color",def:"",note:`e.g. "#ff3d81" or "hotpink". "" = the look's own colour`},{key:"streamerColor",live:!0,label:"Your pin colour",type:"color",def:"",note:`"" = the look's own colour`}]},{group:"Pin trails",items:[{key:"trail.style",label:"Trail",type:"select",options:["auto","none","comet","sparkle","smoke" #gt-gear { position: fixed; right: 14px; bottom: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(20,22,30,.85); color: #fff; font: 22px/44px system-ui; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .25s; z-index: 1000; }
#gt-gear.show { opacity: 1; }
#gt-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100vw; overflow: auto; z-index: 1001;
  background: rgba(16,18,24,.94); color: #e8e8ee; font: 13px/1.4 Inter, system-ui, sans-serif; backdrop-filter: blur(10px);
  box-shadow: -4px 0 24px rgba(0,0,0,.5); display: none; }
#gt-panel.open { display: block; }
#gt-panel header { position: sticky; top: 0; background: rgba(16,18,24,.97); padding: 14px 16px 10px; border-bottom: 1px solid #2a2d38; display: flex; align-items: center; gap: 10px; }
#gt-panel header b { font-size: 15px; flex: 1; }
#gt-panel header small { opacity: .6; }
#gt-panel .close { background: none; border: 0; color: #aaa; font-size: 20px; cursor: pointer; }
#gt-panel section { padding: 10px 16px 6px; border-bottom: 1px solid #22252f; }
#gt-panel h4 { margin: 4px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #9aa3c7; }
#gt-panel .row { display: grid; grid-template-columns: 1fr minmax(120px, auto); align-items: center; gap: 8px; margin: 6px 0; }
#gt-panel .row label { color: #dfe3f0; }
#gt-panel .row small { display: block; color: #7f869c; font-size: 11px; }
#gt-panel .ctl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
#gt-panel input[type=range] { width: 78px; accent-color: #ffd23f; }
#gt-panel input[type=number] { width: 52px; background: #0f1116; color: #fff; border: 1px solid #333846; border-radius: 4px; padding: 3px 4px; font: inherit; }
#gt-panel input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid #333846; border-radius: 4px; background: #0f1116; }
#gt-panel select { background: #0f1116; color: #fff; border: 1px solid #333846; border-radius: 4px; padding: 3px 4px; font: inherit; max-width: 120px; }
#gt-panel .x { background: #2a2d38; border: 0; color: #ccc; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; }
#gt-panel .x.off { opacity: .35; }
#gt-panel .toggle { width: 40px; height: 22px; border-radius: 11px; background: #333846; position: relative; cursor: pointer; border: 0; }
#gt-panel .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
#gt-panel .toggle.on { background: #ffd23f; } #gt-panel .toggle.on::after { left: 21px; }
#gt-panel footer { position: sticky; bottom: 0; background: rgba(16,18,24,.97); padding: 12px 16px; border-top: 1px solid #2a2d38; display: flex; flex-wrap: wrap; gap: 8px; }
#gt-panel footer button { flex: 1 1 45%; padding: 8px 10px; border-radius: 6px; border: 1px solid #333846; background: #1c1f28; color: #fff; cursor: pointer; font: inherit; }
#gt-panel footer button.primary { background: #ffd23f; color: #1a1400; border-color: #ffd23f; font-weight: 700; }
#gt-panel footer .note { flex: 1 1 100%; color: #7f869c; font-size: 11px; }
