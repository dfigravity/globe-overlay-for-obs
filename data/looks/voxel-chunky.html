ky clear glass)"},{key:"glass.cells",live:!0,label:"Pane count",type:"range",min:40,max:400,step:10,def:200,note:"how many panes make up the land. More = smaller panes"},{key:"glass.leadWidth",live:!0,label:"Lead width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of the black lead lines and the coastline"},{key:"glass.mottle",live:!0,label:"Glass texture",type:"range",min:0,max:3,step:.05,def:1,note:"mottle, streaks and bubbles in the glass. 0 = smooth"},{key:"glass.glint",live:!0,label:"Glint speed",type:"range",min:0,max:4,step:.05,def:1,note:"how fast the light sweeps across the panes. 0 = still"},{key:"glass.oceanLead",live:!0,label:"Sea lead lines",type:"range",min:0,max:3,step:.05,def:1,note:"the faint lead net over the sea (ocean style auto). 0 = none"},{key:"glass.frame",live:!0,label:"Window frame",type:"toggle",def:!0,note:"a lead ring round the globe"}]},{group:"Vector scope",looks:["scope"],items:[{key:"scope.phosphor",live:!0,label:"Phosphor",type:"select",options:["green","blue","amber"],labels:["P31 green","P7 blue-white","P3 amber"],def:"green",note:"the screen's phosphor; Continent colour overrides it with any colour"},{key:"scope.persistence",live:!0,label:"Persistence",type:"range",min:0,max:1,step:.05,def:.5,note:"how long beams afterglow: swoops, writing, the retrace tail. 0 = snappy, 1 = long glow"},{key:"scope.beam",live:!0,label:"Beam width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of every beam line"},{key:"scope.glow",live:!0,label:"Glow",type:"range",min:0,max:4,step:.05,def:1,note:"phosphor bloom around the lines. 0 = none"},{key:"scope.retrace",live:!0,label:"Retrace speed",type:"range",min:0,max:4,step:.05,def:1,note:"beams re-drawing the coastline. 0 = steady, no retrace"},{key:"scope.jitter",live:!0,label:"Beam jitter",type:"range",min:0,max:4,step:.05,def:1,note:"analog shimmer on the coastline. 0 = rock steady"},{key:"scope.graticule",live:!0,label:"Grid lines",type:"toggle",def:!0,note:"the dim latitude
