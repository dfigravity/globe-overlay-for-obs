ntinent colour, Coastline colour = the lead)`},{key:"glass.cells",live:!0,label:"Pane count",type:"range",min:40,max:400,step:10,def:200,note:"how many panes make up the land. More = smaller panes"},{key:"glass.leadWidth",live:!0,label:"Lead width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of the black lead lines and the coastline"},{key:"glass.mottle",live:!0,label:"Glass texture",type:"range",min:0,max:3,step:.05,def:1,note:"mottle, streaks and bubbles in the glass. 0 = smooth"},{key:"glass.glint",live:!0,label:"Glint speed",type:"range",min:0,max:4,step:.05,def:1,note:"how fast the light sweeps across the panes. 0 = still"},{key:"glass.oceanLead",live:!0,label:"Sea lead lines",type:"range",min:0,max:3,step:.05,def:1,note:"the faint lead net over the sea (ocean style auto). 0 = none"},{key:"glass.frame",live:!0,label:"Window frame",type:"toggle",def:!0,note:"a lead ring round the globe"}]},{group:"Vector scope",looks:["scope"],items:[{key:"scope.phosphor",live:!0,label:"Phosphor",type:"select",options:["green","p1","blue","amber","white","red","cyan","magenta","violet","land"],labels:["P31 green","P1 radar green","P7 blue-white","P3 amber","P4 white","Red","Cyan","Magenta","Violet","Use Continent colours"],def:"green",note:`the screen's phosphor colour. Pick "Use Continent colours" to use the Land group's colours (beam = Continent, grid and rim = Coastline)`},{key:"scope.persistence",live:!0,label:"Persistence",type:"range",min:0,max:1,step:.05,def:.5,note:"how long beams afterglow: swoops, writing, the retrace tail. 0 = snappy, 1 = long glow"},{key:"scope.beam",live:!0,label:"Beam width",type:"range",min:.3,max:4,step:.05,def:1,note:"thickness of every beam line"},{key:"scope.glow",live:!0,label:"Glow",type:"range",min:0,max:4,step:.05,def:1,note:"phosphor bloom around the lines. 0 = none"},{key:"scope.retrace",live:!0,label:"Retrace speed",type:"range",min:0,max:4,step:.05,def:1,note:"beams re-drawing the coastline. 0 = steady, no retrace"},{key:"scope.jitter",live:!0,label:"Beam jitter",type:"range",min:0,max:4,step:.05,def:1,note:"analog shimmer on the coastline. 0 = rock steady"},{key:"scope.graticule",live:!0,label:"Grid lines",type:"toggle",def:!0,note:"the dim latitude/longitude grid"}]},{group:"Paper",looks:["paper"],items:[{key:"paper.layers",live:!0,label:"Paper layers",type:"range",min:2,max:7,step:1,def:5,note:"how many cut-paper sheets the continents are stacked from"},{key:"paper.palette",live:!0,label:"Paper colours",type:"select",options:["pastel","kraft","atlas","mono","neon","land"],labels:["Pastel","Kraft","Atlas","Mono","Neon","Use Continent colours"],def:"pastel",note:`pastel (soft rainbow) \xB7 kraft (brown card) \xB7 atlas (relief-map greens) \xB7 mono (white card) \xB7 neon (bright card). Pick "Use Continent colours" to use the Land group's colours (sheets from the Continent colour, cut edges from the Coastline colour)`},{key:"paper.spacing",live:!0,label:"Layer spacing",type:"range",min:0,max:3,step:.05,def:1,note:"gap between the sheets: more = deeper stack, longer shadows, more parallax. 0 = flat"},{key:"paper.shadow",live:!0,label:"Shadow strength",type:"range",min:0,max:2,step:.05,def:1,note:"drop shadow under each sheet and onto your video. 0 = none"},{key:"paper.softness",live:!0,label:"Shadow softness",type:"range",min:.2,max:3,step:.05,def:1,note:"1.0 = soft, 0.3 = crisp, 3.0 = very blurry"},{key:"paper.tissue",live:!0,label:"Tissue-paper sea",type:"toggle",def:!0,note:"translucent blue tissue strips along the coasts (ocean style auto). Off = the swell pattern instead"},{key:"paper.flag",live:!0,label:"Name style",type:"select",options:["plain","banner"],labels:["Plain names","Paper ribbon banners"],def:"plain",note:"plain (outlined names, no background) \xB7 banner (names on a paper ribbon)"}]},{group:"1-Bit",looks:["dither"],items:[{key:"dither.pixel",live:!0,label:"Pixel size",type:"range",min:1,max:4,step:1,def:2,note:"screen pixels per dither pixel. 2 = crisp, 3\u20134 = {key:"nameHeight",live:!0,label:"Name height above surface",type:"range",min:0,max:3,step:.05,def:1,note:"how far names float above the ground (the needle length). 1.0 = normal, 2.0 = twice as high, 0 = on the surface"}]},{group:"Crowded names",items:[{key:"labels.cycle",live:!0,label:"Take turns when names crowd",type:"toggle",def:!0,note:"when names pile up in one area, show a few at a time and rotate through the rest. Your name always shows; new check-ins jump the queue"},{key:"labels.max",live:!0,label:"Names shown per crowd",type:"range",min:1,max:8,step:1,def:3,note:"how many names in one crowded area are visible at once (yours counts)"},{key:"labels.dwell",live:!0,label:"Seconds per name",type:"range",min:1,max:15,step:.5,def:4,note:"how long each name stays before the next one takes its place"},{key:"labels.spotlight",live:!0,label:"New check-in spotlight",type:"range",min:0,max:20,step:1,def:8,note:"seconds a new check-in is guaranteed to show. 0 = waits its turn"},{key:"labels.radius",live:!0,label:"Crowd size",type:"range",min:1,max:15,step:.5,def:4,note:"how close (in degrees, ~110 km each) check-ins must be to share turns"}]},{group:"Pins",items:[{key:"pinWidth",live:!0,label:"Needle thickness",type:"range",min:.5,max:8,step:.1,def:1,note:"2.0 = twice as thick"},{key:"pinSize",live:!0,label:"Pin head size",type:"range",min:.5,max:5,step:.05,def:1,note:"the dot on top"},{key:"pinColor",live:!0,label:"Viewer pin colour",type:"color",def:"",note:`e.g. "#ff3d81" or "hotpink". "" = the look's own colour`},{key:"streamerColor",live:!0,label:"Your pin colour",type:"color",def:"",note:`"" = the look's own colour`}]},{group:"Pin trails",items:[{key:"trail.style",label:"Trail",type:"select",options:["auto","none","comet","sparkle","smoke","ribbon","embers","electric","datastream"],def:"auto",live:!0,note:"auto = the style that suits this look (comet on most). All stream behind the pin head as the globe turns: comet (soft glowing tail) \xB7 sparkle (twinkling star
