",live:!0,label:"Tissue-paper sea",type:"toggle",def:!0,note:"translucent blue tissue strips along the coasts (ocean style auto). Off = the swell pattern instead"},{key:"paper.flag",live:!0,label:"Name style",type:"select",options:["banner","plain"],def:"banner",note:"banner (names on a paper ribbon) \xB7 plain (classic outlined names)"}]},{group:"1-Bit",looks:["dither"],items:[{key:"dither.pixel",live:!0,label:"Pixel size",type:"range",min:1,max:4,step:1,def:2,note:"screen pixels per dither pixel. 2 = crisp, 3\u20134 = chunky retro"},{key:"dither.inks",live:!0,label:"Ink pair",type:"select",options:["bone","paper","phosphor","amber","gameboy","blueprint","riso","ice"],def:"bone",note:"the two inks (light / dark). Continent colour and Coastline colour override them"},{key:"dither.pattern",live:!0,label:"Dither",type:"select",options:["bayer4","bayer8","halftone","riso"],def:"bayer8",note:"bayer4 (coarse grid) \xB7 bayer8 (fine grid) \xB7 halftone (45\xB0 dot screen) \xB7 riso (halftone with the dark ink printed off-register)"},{key:"dither.contrast",live:!0,label:"Contrast",type:"range",min:.3,max:3,step:.05,def:1,note:"how hard the light falls off into the shadow side"},{key:"dither.hatch",live:!0,label:"Engraved hatching",type:"toggle",def:!0,note:"latitude lines that thicken into the shadow. Off = plain dither"},{key:"dither.graticule",live:!0,label:"Graticule",type:"toggle",def:!0,note:"dotted 30\xB0 latitude/longitude lines over the sea"},{key:"dither.dial",live:!0,label:"Pocket-watch dial",type:"toggle",def:!0,note:"the ticking watch dial around your pin (uses the ring colour/size/speed)"}]},{group:"Land",items:[{key:"land.color",live:!0,label:"Continent colour",type:"color",def:"",note:`e.g. "#f3ecdc" (cream) or "#101820" (near black). "" = the look's own`},{key:"land.edge",live:!0,label:"Coastline colour",type:"color",def:"",note:`"" = the look's own`}]},{group:"Ocean",items:[{key:"ocean.on",live:!0,label:"Animate the ocean",type:"toggle",def:!0,note:"a fain #gt-gear { position: fixed; right: 14px; bottom: 14px; width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(20,22,30,.85); color: #fff; font: 22px/44px system-ui; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .25s; z-index: 1000; }
#gt-gear.show { opacity: 1; }
#gt-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 100vw; overflow: auto; z-index: 1001;
  background: rgba(16,18,24,.94); color: #e8e8ee; font: 13px/1.4 Inter, system-ui, sans-serif; backdrop-filter: blur(10px);
  box-shadow: -4px 0 24px rgba(0,0,0,.5); display: none; }
#gt-panel.open { display: block; }
#gt-panel header { position: sticky; top: 0; background: rgba(16,18,24,.97); padding: 14px 16px 10px; border-bottom: 1px solid #2a2d38; display: flex; align-items: center; gap: 10px; }
#gt-panel header b { font-size: 15px; flex: 1; }
#gt-panel header small { opacity: .6; }
#gt-panel .close { background: none; border: 0; color: #aaa; font-size: 20px; cursor: pointer; }
#gt-panel section { padding: 10px 16px 6px; border-bottom: 1px solid #22252f; }
#gt-panel h4 { margin: 4px 0 8px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #9aa3c7; }
#gt-panel .row { display: grid; grid-template-columns: 1fr minmax(120px, auto); align-items: center; gap: 8px; margin: 6px 0; }
#gt-panel .row label { color: #dfe3f0; }
#gt-panel .row small { display: block; color: #7f869c; font-size: 11px; }
#gt-panel .ctl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
#gt-panel input[type=range] { width: 78px; accent-color: #ffd23f; }
#gt-panel input[type=number] { width: 52px; background: #0f1116; color: #fff; border: 1px solid #333846; border-radius: 4px; padding: 3px 4px; font: inherit; }
#gt-panel input[type=color] { width: 34px; height: 24px; padding: 0; border: 1px solid #333846; border-radius: 4px; background: #0f1116; }
#gt-panel select { background: #0f1116; color: #fff; border: 1px solid #333846; border-radius: 4px; padding: 3px 4px; font: inherit; max-width: 120px; }
#gt-panel .x { background: #2a2d38; border: 0; color: #ccc; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-size: 12px; }
#gt-panel .x.off { opacity: .35; }
